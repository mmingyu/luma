name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Luma app
        run: bash scripts/build-app.sh

      - name: Publish rolling development release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --cleanup-tag -y || true
          git tag -f dev "$GITHUB_SHA"
          git push --force origin refs/tags/dev
          gh release create dev dist/Luma-macOS-arm64.zip \
            --title "Luma Development Build" \
            --notes "Automated Apple Silicon build from main at \`$GITHUB_SHA\`." \
            --prerelease

      - name: Publish versioned release from release commit
        if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' packaging/Info.plist)"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Luma-macOS-arm64.zip --clobber
          else
            gh release create "$TAG" dist/Luma-macOS-arm64.zip \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes
          fi

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Luma-macOS-arm64.zip --clobber
          else
            gh release create "$TAG" dist/Luma-macOS-arm64.zip \
              --title "$TAG" \
              --generate-notes
          fi
